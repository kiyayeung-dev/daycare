<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Daycare Map — Saskatoon</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F3ED; --card:#FFFDF8; --ink:#2A2320; --soft:#8A7D6F; --line:#E7DDCD;
    --accent:#C2703D; --accent-soft:#F1E4D6; --sage:#5F7161;
    --st-todo:#CBBFAE; --st-called:#D89B34; --st-wait:#5F7161; --st-full:#A6503F;
    --radius:14px; --radius-sm:10px;
    --bar-h:0px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  #map{position:absolute;inset:0;z-index:1;background:#dfe6df}
  .leaflet-container{font-family:inherit}

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:linear-gradient(var(--paper) 78%, rgba(244,238,228,0));
  }
  .bar-row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
  .brand small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:3px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 1px 3px rgba(42,35,32,.08)}
  .seg button{border:none;background:none;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--soft);padding:6px 13px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--paper)}

  .addr-row{display:flex;gap:8px}
  .addr-in{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);
    padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;box-shadow:0 1px 3px rgba(42,35,32,.06)
  }
  .addr-in:focus{border-color:var(--accent)}
  .addr-in::placeholder{color:var(--soft)}
  .btn{
    border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);
    padding:0 13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 1px 3px rgba(42,35,32,.06)
  }
  .btn:active{transform:scale(.97)}
  .btn.solid{background:var(--sage);color:#fff;border-color:var(--sage)}

  .radius-row{display:flex;align-items:center;gap:10px;margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 1px 3px rgba(42,35,32,.06)}
  .radius-row input[type=range]{flex:1;accent-color:var(--accent);height:20px}
  .radius-lbl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);white-space:nowrap;min-width:38px;text-align:right}
  .radius-count{font-size:12px;color:var(--soft);white-space:nowrap}

  .hint{font-size:11px;color:var(--soft);margin:8px 2px 0;display:flex;align-items:center;gap:6px}
  .progress{
    display:none;margin:8px 2px 0;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);
    align-items:center;gap:7px
  }
  .progress.show{display:flex}
  .spin{width:11px;height:11px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- List view ---------- */
  #listwrap{
    position:absolute;inset:0;z-index:500;background:var(--paper);overflow-y:auto;
    padding:var(--bar-h) 14px 40px;display:none;-webkit-overflow-scrolling:touch
  }
  body.list #listwrap{display:block}
  body.list #map{visibility:hidden}
  .list-top{height:14px}
  .band-shell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin:0 0 14px;box-shadow:0 1px 2px rgba(42,35,32,.04)}
  .band-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .band-title{font-weight:600;font-size:12.5px}
  .band-count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--soft)}
  .band{display:flex;gap:2px;height:32px;align-items:flex-end;margin-bottom:10px}
  .tick{flex:1;min-width:2px;background:var(--st-todo);border-radius:2px;height:36%}
  .tick.called{background:var(--st-called);height:64%}
  .tick.waitlist{background:var(--st-wait);height:100%}
  .tick.full{background:var(--st-full);height:50%}
  .legend{display:flex;flex-wrap:wrap;gap:11px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soft)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .search2{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);margin-bottom:10px;outline:none}
  .search2:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.fav.on{background:var(--accent);border-color:var(--accent)}

  .lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:11px;box-shadow:0 1px 2px rgba(42,35,32,.04);cursor:pointer}
  .lcard.fav{border-color:var(--accent)}
  .lc-head{display:flex;gap:9px;align-items:flex-start}
  .lc-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;line-height:1.2;margin:0;flex:1;letter-spacing:-.01em}
  .lc-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .pill.st-called{background:#F6E3BE;color:#7a5410}
  .pill.st-waitlist{background:#DCE4DA;color:#3f5142}
  .pill.st-full{background:#EEDAD5;color:#7a382b}
  .pill.dist{background:#E4EAE2;color:var(--sage)}
  .lc-when{font-size:11.5px;color:var(--soft)}

  /* ---------- Bottom sheet ---------- */
  #scrim{position:fixed;inset:0;z-index:1400;background:rgba(42,35,32,.28);opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.show{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--card);
    border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(42,35,32,.18);
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:82vh;overflow-y:auto
  }
  #sheet.show{transform:translateY(0)}
  .grip{width:38px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 12px}
  .sh-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.02em;margin:0 26px 8px 0}
  .sh-close{position:absolute;top:14px;right:16px;border:none;background:var(--paper);width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--soft);cursor:pointer;line-height:1}
  .sh-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .tag.type{background:#E4EAE2;color:var(--sage)}
  .sh-addr{color:var(--soft);font-size:13.5px;margin-bottom:4px;line-height:1.45}
  .sh-dist{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--sage);margin-bottom:14px}
  .routebox{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px}
  .rb-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
  .rb-row b{font-weight:700;color:var(--ink)}
  .rb-ic{font-size:16px;width:20px;text-align:center}
  .rb-line{width:32px;flex-shrink:0}
  .rb-line.walk{border-top:3px dotted var(--sage)}
  .rb-line.drive{border-top:3px solid var(--accent)}
  .rb-d{color:var(--soft);font-family:"IBM Plex Mono",monospace;font-size:12px;margin-left:auto}
  .rb-hint{font-size:12.5px;color:var(--soft);line-height:1.45}
  .sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .act{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper)}
  .act:active{transform:scale(.97)}
  .act.call{background:var(--sage);color:#fff;border-color:var(--sage)}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
  .status-row{display:flex;gap:6px;margin-bottom:14px}
  .status-row button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);padding:10px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--soft)}
  .status-row button.sel[data-s="todo"]{background:var(--st-todo);color:#4a4136;border-color:var(--st-todo)}
  .status-row button.sel[data-s="called"]{background:var(--st-called);color:#463207;border-color:var(--st-called)}
  .status-row button.sel[data-s="waitlist"]{background:var(--st-wait);color:#fff;border-color:var(--st-wait)}
  .status-row button.sel[data-s="full"]{background:var(--st-full);color:#fff;border-color:var(--st-full)}
  .timeline{background:var(--paper);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:var(--ink);display:none}
  .timeline.show{display:block}
  .timeline .tl{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  .timeline .tl b{font-weight:600}
  .timeline .tl span{color:var(--soft);font-family:"IBM Plex Mono",monospace;font-size:11.5px}
  .note-in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:70px;outline:none}
  .note-in:focus{border-color:var(--accent);background:var(--card)}
  .note-in::placeholder{color:var(--soft)}
  .heart-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--soft);cursor:pointer;font-family:inherit;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
  .heart-btn.on{color:var(--accent);border-color:var(--accent)}

  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%) translateY(20px);z-index:2000;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .home-pin{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .dpin{background:none;border:0}
  .dpin-hit{width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .dpin-dot{display:block;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="bar-row1">
    <div class="brand">Daycare Map<small>Saskatoon · Call Tracker</small></div>
    <div class="seg">
      <button id="tabMap" class="on">Map</button>
      <button id="tabList">List</button>
    </div>
  </div>
  <div class="addr-row" id="mapControls">
    <input class="addr-in" id="addr" placeholder="Enter your home address…" autocomplete="off" enterkeyhint="search">
    <button class="btn solid" id="locateBtn">Find</button>
    <button class="btn" id="gpsBtn" title="Use my location">◎</button>
  </div>
  <div class="radius-row" id="radiusRow">
    <span style="font-size:12px;color:var(--soft)">Radius</span>
    <input type="range" id="radius" min="1" max="15" step="1" value="5">
    <span class="radius-lbl" id="radiusLbl">5 km</span>
    <span class="radius-count" id="radiusCount"></span>
  </div>
  <div class="hint" id="hint">◉ Enter your home address above, then a ring shows the daycares nearest you · tap a green dot for its call card</div>
  <div class="progress" id="progress"><span class="spin"></span><span id="progressTxt">Mapping daycares…</span></div>
</div>

<div id="listwrap">
  <div class="list-top"></div>
  <div class="band-shell">
    <div class="band-top">
      <span class="band-title">Campaign progress</span>
      <span class="band-count" id="count">0 called · 0 waitlists</span>
    </div>
    <div class="band" id="band"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--st-todo)"></i>Not called</span>
      <span><i class="dot" style="background:var(--st-called)"></i>Called</span>
      <span><i class="dot" style="background:var(--st-wait)"></i>Waitlist</span>
      <span><i class="dot" style="background:var(--st-full)"></i>Full / no</span>
    </div>
  </div>
  <input class="search2" id="search" placeholder="Search by name or address…" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<div id="scrim"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

async function sget(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }

function mk(id){ if(!marks[id]) marks[id]={status:"todo",note:"",fav:false}; return marks[id]; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function tel(p){ return "tel:"+p.replace(/[^0-9]/g,"").slice(0,10); }
function mapsSearch(a){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a); }
function streetView(a){ return "https://www.google.com/maps?q="+encodeURIComponent(a)+"&layer=c"; }
function cleanAddr(a){ return a.replace(/\([^)]*\)/g,"").replace(/^#?\d+\s*[–-]\s*/,"").replace(/\bUnit\s*\d+,?\s*/i,"").replace(/\s+/g," ").trim(); }

function ago(ts){
  if(!ts) return "";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<45) return "just now";
  const m=Math.floor(s/60); if(m<60) return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+" hr ago";
  const d=Math.floor(h/24); if(d<7) return d+(d===1?" day ago":" days ago");
  const w=Math.floor(d/7); if(w<5) return w+(w===1?" week ago":" weeks ago");
  const mo=Math.floor(d/30); if(mo<12) return mo+(mo===1?" month ago":" months ago");
  const y=Math.floor(d/365); return y+(y===1?" yr ago":" yrs ago");
}
function dateStr(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function dist(a,b){
  const R=6371,tr=x=>x*Math.PI/180;
  const dLa=tr(b[0]-a[0]),dLn=tr(b[1]-a[1]),la1=tr(a[0]),la2=tr(b[0]);
  const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

let map=null, ring=null, homeMarker=null, homeIcon=null, mapReady=false;
function initMap(){
  if(typeof L==="undefined" || !L.map){
    mapReady=false;
    const el=document.getElementById("map");
    if(el) el.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px;color:#8A7D6F;font-size:14px;line-height:1.55">The map loads over the internet, which this in-app preview blocks.<br><br>Open this on a web link (in Safari) to see the map.<br>Your call list works right here in the meantime — tap <b>List</b> above.</div>';
    return;
  }
  try{
    map=L.map("map",{zoomControl:false,attributionControl:true}).setView([52.13,-106.67],12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    L.control.zoom({position:"bottomright"}).addTo(map);
    homeIcon=L.divIcon({html:'<div class="home-pin">📍</div>',className:"",iconSize:[26,26],iconAnchor:[13,26]});
    // map taps no longer move home (that was hijacking daycare-pin taps); set home via the address bar or ◎ button
    mapReady=true;
  }catch(err){ mapReady=false; }
}

function addMarker(p){
  if(!mapReady||!map) return;
  const c=geo[p.addr]; if(!c) return;
  const status=(marks[p.id]&&marks[p.id].status)||"todo";
  const fav=!!(marks[p.id]&&marks[p.id].fav);
  const m=L.circleMarker(c,{radius:fav?12:10,weight:2.5,color:"#fff",fillColor:ST_COLOR[status],fillOpacity:1,bubblingMouseEvents:false});
  m.on("click",()=>openSheet(p));
  m.addTo(map);
  p.marker=m;
  refreshMarker(p);
}
function refreshMarker(p){
  if(!p.marker) return;
  const status=(marks[p.id]&&marks[p.id].status)||"todo";
  const fav=!!(marks[p.id]&&marks[p.id].fav);
  const inR = home && geo[p.addr] ? dist(home,geo[p.addr])<=radiusKm : true;
  p.marker.setStyle({fillColor:ST_COLOR[status], fillOpacity:inR?1:0.3, opacity:inR?1:0.45, radius: fav?12:10});
}
function refreshAllMarkers(){ places.forEach(refreshMarker); }

/* ---------- routing (walk = dotted, drive = solid, follows roads) ---------- */
let routeDrive=null, routeWalk=null;
function clearRoutes(){
  if(routeDrive){ try{map.removeLayer(routeDrive);}catch(e){} routeDrive=null; }
  if(routeWalk){ try{map.removeLayer(routeWalk);}catch(e){} routeWalk=null; }
}
function mins(sec){ const m=Math.round(sec/60); if(m<1) return "1 min"; if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return h+" hr"+(r?" "+r+" min":""); }
async function osrm(mode, from, to){
  const url="https://router.project-osrm.org/route/v1/"+mode+"/"+from[1]+","+from[0]+";"+to[1]+","+to[0]+"?overview=full&geometries=geojson";
  const r=await fetch(url); if(!r.ok) throw new Error("osrm "+r.status);
  const j=await r.json(); if(!j.routes||!j.routes.length) throw new Error("no route");
  return {dur:j.routes[0].duration, dist:j.routes[0].distance, coords:j.routes[0].geometry.coordinates.map(a=>[a[1],a[0]])};
}
async function showRoutes(p){
  const c=geo[p.addr]; if(!home||!c||!mapReady||!map) return;
  clearRoutes();
  const walkT=document.getElementById("walkT"), driveT=document.getElementById("driveT"),
        walkD=document.getElementById("walkD"), driveD=document.getElementById("driveD");
  const km=dist(home,c);
  const [w,d]=await Promise.allSettled([osrm("walking",home,c), osrm("driving",home,c)]);
  if(w.status==="fulfilled"){
    if(walkT) walkT.textContent=mins(w.value.dur);
    if(walkD) walkD.textContent=(w.value.dist/1000).toFixed(1)+" km";
    routeWalk=L.polyline(w.value.coords,{color:"#5F7161",weight:4,opacity:.9,dashArray:"1 10",lineCap:"round"}).addTo(map);
  } else if(walkT){ walkT.textContent="~"+Math.max(1,Math.round(km/5*60))+" min"; if(walkD) walkD.textContent="~"+km.toFixed(1)+" km"; }
  if(d.status==="fulfilled"){
    if(driveT) driveT.textContent=mins(d.value.dur);
    if(driveD) driveD.textContent=(d.value.dist/1000).toFixed(1)+" km";
    routeDrive=L.polyline(d.value.coords,{color:"#C2703D",weight:5,opacity:.92}).addTo(map);
  } else if(driveT){ driveT.textContent="~"+Math.max(1,Math.round(km/40*60))+" min"; if(driveD) driveD.textContent="~"+km.toFixed(1)+" km"; }
  try{ map.fitBounds(L.latLngBounds([home,c]),{paddingTopLeft:[40,95],paddingBottomRight:[40,Math.round(window.innerHeight*0.5)]}); }catch(e){}
}

function setHome(latlng,fly){
  home=latlng;
  if(mapReady&&map){
    if(homeMarker) homeMarker.setLatLng(latlng); else homeMarker=L.marker(latlng,{icon:homeIcon,zIndexOffset:2000}).addTo(map);
    drawRing();
    if(fly!==false) map.setView(latlng,13);
    refreshAllMarkers();
  }
  updateRadiusCount(); saveHome();
  const h=document.getElementById("hint"); if(h) h.style.display="none";
  if(document.body.classList.contains("list")) renderList();
}
function drawRing(){
  if(!home||!mapReady||!map) return;
  if(ring) map.removeLayer(ring);
  ring=L.circle(home,{radius:radiusKm*1000,color:"#C2703D",weight:1.5,fillColor:"#C2703D",fillOpacity:.07}).addTo(map);
}
function updateRadiusCount(){
  const el=document.getElementById("radiusCount");
  if(!home){ el.textContent=""; return; }
  let n=0; places.forEach(p=>{ if(geo[p.addr]&&dist(home,geo[p.addr])<=radiusKm) n++; });
  el.textContent="· "+n+" near you";
}

/* ---------- geocoding queue ---------- */
let queue=[], busy=false, done=0, target=0;
async function geocode(q){
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca&q="+encodeURIComponent(q);
  const res=await fetch(url,{headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("http "+res.status);
  const arr=await res.json();
  if(!arr.length) throw new Error("empty");
  return [parseFloat(arr[0].lat),parseFloat(arr[0].lon)];
}
function startGeocoding(){
  if(!mapReady) return;   // list works without coordinates; only geocode when a map exists
  places.forEach(p=>{ if(geo[p.addr]){ addMarker(p); done++; } else { queue.push(p); } });
  target=places.length;
  updateProgress();
  pump();
}
function pump(){
  if(busy) return;
  const p=queue.shift();
  if(!p){ progress.classList.remove("show"); updateRadiusCount(); return; }
  busy=true;
  geocode(cleanAddr(p.addr))
    .then(c=>{ geo[p.addr]=c; saveGeo(); addMarker(p); })
    .catch(()=>{ if((p._try=(p._try||0)+1)<2) queue.push(p); })
    .finally(()=>{ done++; busy=false; updateProgress(); setTimeout(pump,1100); });
}
const progress=document.getElementById("progress");
function updateProgress(){
  const placed=places.filter(p=>geo[p.addr]).length;
  if(placed>=target || queue.length===0 && !busy){
    if(placed>=target-2){ progress.classList.remove("show"); updateRadiusCount(); return; }
  }
  progress.classList.add("show");
  document.getElementById("progressTxt").textContent="Mapping daycares… "+placed+"/"+target;
  if(placed>=target){ progress.classList.remove("show"); updateRadiusCount(); }
}

  `;

const filters={type:new Set(),infant:false,fav:false,tocall:false,q:""};
function buildChips(){

    {k:"type",v:"Centre",label:"Centres"},
    {k:"type",v:"Home",label:"Home"},
    {k:"type",v:"Group family child care home",label:"Group home"},

    c.onclick=()=>{
      if(d.k==="type"){ filters.type.has(d.v)?filters.type.delete(d.v):filters.type.add(d.v); }
      else { filters[d.k]=!filters[d.k]; }
      c.classList.toggle("on"); renderList();
    };
    box.appendChild(c);
  });

function renderBand(){
  const band=document.getElementById("band"); band.innerHTML="";
  let called=0,wait=0;
  places.forEach(p=>{
    const s=(marks[p.id]&&marks[p.id].status)||"todo";
    if(s==="called")called++; if(s==="waitlist")wait++;
    const t=document.createElement("div");
    t.className="tick"+(s!=="todo"?" "+s:""); t.title=p.name;
    band.appendChild(t);
  });
  document.getElementById("count").textContent=called+" called · "+wait+" waitlist"+(wait===1?"":"s");
}
function passes(p){
  if(filters.type.size&&!p.types.some(t=>filters.type.has(t))) return false;
  if(filters.infant&&!p.infant) return false;
  if(filters.fav&&!(marks[p.id]&&marks[p.id].fav)) return false;
  if(filters.tocall&&marks[p.id]&&marks[p.id].status!=="todo") return false;
  if(filters.q){ if(!(p.name+" "+p.addr).toLowerCase().includes(filters.q)) return false; }
  return true;
}
function renderList(){
  renderBand();
  const list=document.getElementById("list");

    const da=geo[a.addr]?dist(home,geo[a.addr]):9999, db=geo[b.addr]?dist(home,geo[b.addr]):9999; return da-db;
  }); }

    const distPill = home&&geo[p.addr] ? `<span class="pill dist">${dist(home,geo[p.addr]).toFixed(1)} km</span>` : "";
    let when="";
    if(m.status==="called"&&m.calledAt) when=`<span class="lc-when">called ${ago(m.calledAt)}</span>`;
    if(m.status==="waitlist"&&m.waitAt) when=`<span class="lc-when">waitlisted ${ago(m.waitAt)}</span>`;
    const typeTag=p.types[0]?`<span class="pill" style="background:#E4EAE2;color:var(--sage)">${esc(SHORT[p.types[0]]||p.types[0])}</span>`:"";
    card.innerHTML=`
      <div class="lc-head">
        <h3 class="lc-name">${esc(p.name)}</h3>
        <span style="font-size:18px;color:${m.fav?"var(--accent)":"var(--st-todo)"}">${m.fav?"♥":"♡"}</span>
      </div>
      <div class="lc-meta">${distPill}${stPill}${typeTag}${when}</div>`;
    card.onclick=()=>focusOnMap(p);
    list.appendChild(card);
  });
}
document.getElementById("search").oninput=e=>{ filters.q=e.target.value.trim().toLowerCase(); renderList(); };

/* ---------- tabs ---------- */
const tabMap=document.getElementById("tabMap"), tabList=document.getElementById("tabList");
const mapControls=document.getElementById("mapControls"), radiusRow=document.getElementById("radiusRow"), hintEl=document.getElementById("hint");
function showMap(){
  document.body.classList.remove("list");
  tabMap.classList.add("on"); tabList.classList.remove("on");
  mapControls.style.display="flex"; radiusRow.style.display="flex";
  hintEl.style.display=home?"none":"flex";
  setBarHeight();
  if(map) setTimeout(()=>map.invalidateSize(),60);
}
function showList(){
  document.body.classList.add("list");
  tabList.classList.add("on"); tabMap.classList.remove("on");
  mapControls.style.display="none"; radiusRow.style.display="none"; hintEl.style.display="none"; progress.classList.remove("show");
  setBarHeight(); renderList();
}
tabMap.onclick=showMap; tabList.onclick=showList;

/* keep list content clear of the floating bar */
function setBarHeight(){
  const h=document.getElementById("topbar").offsetHeight;
  document.documentElement.style.setProperty("--bar-h", h+"px");
}
window.addEventListener("resize",setBarHeight);

/* ---------- controls ---------- */
document.getElementById("radius").oninput=e=>{
  radiusKm=+e.target.value;
  document.getElementById("radiusLbl").textContent=radiusKm+" km";
  drawRing(); refreshAllMarkers(); updateRadiusCount(); saveHome();
};
document.getElementById("locateBtn").onclick=doGeocodeAddress;
document.getElementById("addr").addEventListener("keydown",e=>{ if(e.key==="Enter") doGeocodeAddress(); });
async function doGeocodeAddress(){
  const q=document.getElementById("addr").value.trim();
  if(!q){ toast("Type your address first"); return; }
  const btn=document.getElementById("locateBtn"); const old=btn.textContent; btn.textContent="…";
  try{
    const c=await geocode(q.match(/sask|sk|canada/i)?q:q+", Saskatoon, SK");
    setHome(c,true); toast("Home set");
  }catch(err){ toast("Couldn't find that — try tapping the map"); }
  btn.textContent=old;
}
document.getElementById("gpsBtn").onclick=()=>{
  if(!navigator.geolocation){ toast("Location not available — tap the map instead"); return; }
  toast("Locating…");
  navigator.geolocation.getCurrentPosition(
    pos=>{ setHome([pos.coords.latitude,pos.coords.longitude],true); toast("Home set to your location"); },
    ()=>{ toast("Location blocked — type your address or tap the map"); },
    {enableHighAccuracy:true,timeout:8000}
  );
};

let toastT;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200);
}

/* ---------- boot ---------- */
(async ()=>{
  initMap();
  setBarHeight();
  marks=(await sget(KEY))||{};
  geo=(await sget(GEO_KEY))||{};
  const savedHome=await sget(HOME_KEY);
  if(savedHome&&savedHome.home){
    radiusKm=savedHome.radiusKm||5;
    document.getElementById("radius").value=radiusKm;
    document.getElementById("radiusLbl").textContent=radiusKm+" km";
  }
  buildChips();
  renderBand();
  startGeocoding();
  if(!mapReady){ showList(); }
  if(savedHome&&savedHome.home){ setHome(savedHome.home,true); }
})();
</script>
</body>
</html>
